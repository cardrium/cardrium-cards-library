# 派生自 ai-workbench/app ops/workflows/example-cards/cards-ci.yml（commit c6fbce5）
# 必需检查名：cards-ok、review-gate（两者都设为必需）。Actions 均按完整 SHA 固定。部署凭据只用 secrets 占位名。
# 与模板的差异（有意为之）：
#   - validate job 改名为 cards-ok；不再有汇总用的 cards-ok job。PR 上不传 --allow-unreviewed，PR 与 push 都按严格模式构建。
#   - review-gate 重写：只有 contents: read，不调用 GitHub API、不检查 PR Approve，也不再由 pull_request_review 触发；
#     改为校验仓库内 reviews/ 审核记录与 card.json 的 id / 版本 / sha256 一致（tools/review-gate.mjs）。人工把关靠 CODEOWNER Approve。
#   - 校验器随仓库提供（tools/card-validator/，与 m0/card-validator 逐字节一致），cards-ok 先按 tools/card-validator.SOURCE.sha256 核对再 npm ci。
#   - build-card-index 把校验器警告当失败（契约 §2.8）：官方卡任何警告、未知 W_ 码、无码警告都失败。
#   - setup-node 不开 npm 缓存。
#   - publish 去掉了 environment url（vars.TEMPLATES_ORIGIN）和发布后的冒烟检查；Pages 项目名改用 secrets 占位名。
#   - concurrency 按 job 分组：检查类 job 按 PR/ref 分组可取消；publish 单独一组、不取消。
#   - 新增 production-gate（必需）：含代码卡片前提未关闭不得进生产索引；在 publish 等待环境审批前，job summary 列出待发布卡片/含代码/前提是否满足。
#   - 新增 gitleaks job（按 ops/03）：gitleaks CLI v8.30.1（按 sha256 固定）扫描完整历史，读取 .gitleaksignore。
name: Cards CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards-ok:
    name: cards-ok
    concurrency:
      group: cards-check-cards-ok-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 核对校验器与 m0 原件一致
        run: sha256sum --strict -c tools/card-validator.SOURCE.sha256
      - run: npm ci --prefix tools/card-validator --ignore-scripts
      - name: 严格校验并生成索引（不允许未审核）
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          node tools/build-card-index.mjs --cards cards --out dist \
            --manifest-schema tools/card-manifest.schema.json \
            --card-validator tools/card-validator/lib/validate-card.mjs
      - name: 可复现性自检
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          node tools/build-card-index.mjs --cards cards --out "$RUNNER_TEMP/dist2" \
            --manifest-schema tools/card-manifest.schema.json \
            --card-validator tools/card-validator/lib/validate-card.mjs
          diff -r dist "$RUNNER_TEMP/dist2"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cards-dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  review-gate:
    # 独立的审核门槛：只读仓库内容，不调用 GitHub API、不依赖 PR Approve。
    # 检查含代码卡片有 securityReviewedBy；审核记录文件存在于 reviews/；记录含卡片 id、版本与当前 card.json 的 sha256。
    name: review-gate
    concurrency:
      group: cards-check-review-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 审核记录校验
        run: node tools/review-gate.mjs --cards cards

  gitleaks:
    # 按 ops/03：每个 PR 和 main 的 push 都扫完整 git 历史；只认 .gitleaksignore 里的完整指纹（不用通配符）。
    name: gitleaks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    concurrency:
      group: cards-check-gitleaks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 安装 gitleaks（校验 sha256）
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: 扫描完整历史
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts=HEAD --gitleaks-ignore-path .gitleaksignore .

  production-gate:
    # 必需检查。判定脚本与前提清单从 base 分支（PR）/ main（push）加载，PR head 改不了门禁（建议 2）。
    # 含代码卡片在安全前提关闭前不得进入生产索引；cards/ 下禁止 symlink/submodule（A5）。
    name: production-gate
    concurrency:
      group: cards-check-production-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 变更分类（脚本来自 base，仅作标注，不跳过审核）
        if: github.event_name == 'pull_request'
        run: node base/tools/ci/classify-change.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" head | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 生产索引门禁 + 摘要
        run: node base/tools/ci/production-gate.mjs --repo head --preconditions base/tools/ci/code-card-preconditions.json --summary

  publish:
    if: github.event_name == 'push'
    needs: [cards-ok, review-gate, production-gate]
    concurrency:
      group: cards-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cards-production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cards-dist
          path: ${{ runner.temp }}/dist
      - name: 准备 wrangler 独立目录
        run: mkdir -p "$RUNNER_TEMP/wrangler-home" && echo '{"private":true}' > "$RUNNER_TEMP/wrangler-home/package.json"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/wrangler-home
          command: pages deploy ${{ runner.temp }}/dist --project-name=${{ secrets.CF_PAGES_PROJECT_TEMPLATES }} --branch=main --commit-hash=${{ github.sha }}
