# 派生自 ai-workbench/app ops/workflows/example-cards/cards-ci.yml（commit c6fbce5）
# 必需检查名：cards-ok、review-gate（两者都设为必需）。Actions 均按完整 SHA 固定。部署凭据只用 secrets 占位名。
name: Cards CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  cards-ok:
    name: cards-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/card-validator/package-lock.json
      - run: npm ci --prefix tools/card-validator --ignore-scripts
      - name: 严格校验并生成索引（不允许未审核）
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          node tools/build-card-index.mjs --cards cards --out dist \
            --manifest-schema tools/card-manifest.schema.json \
            --card-validator tools/card-validator/lib/validate-card.mjs
      - name: 可复现性自检
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          node tools/build-card-index.mjs --cards cards --out "$RUNNER_TEMP/dist2" \
            --manifest-schema tools/card-manifest.schema.json \
            --card-validator tools/card-validator/lib/validate-card.mjs
          diff -r dist "$RUNNER_TEMP/dist2"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cards-dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  review-gate:
    # 独立的审核门槛：只读仓库内容，不调用 GitHub API、不依赖 PR Approve。
    # 检查含代码卡片有 securityReviewedBy；审核记录文件存在于 reviews/；记录含卡片 id、版本与当前 card.json 的 sha256。
    name: review-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 审核记录校验
        run: node tools/review-gate.mjs --cards cards

  publish:
    if: github.event_name == 'push'
    needs: [cards-ok, review-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cards-production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cards-dist
          path: ${{ runner.temp }}/dist
      - name: 准备 wrangler 独立目录
        run: mkdir -p "$RUNNER_TEMP/wrangler-home" && echo '{"private":true}' > "$RUNNER_TEMP/wrangler-home/package.json"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/wrangler-home
          command: pages deploy ${{ runner.temp }}/dist --project-name=${{ secrets.CF_PAGES_PROJECT_TEMPLATES }} --branch=main --commit-hash=${{ github.sha }}
